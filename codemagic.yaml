workflows:
  android-debug:
    name: DressMe Android APK
    environment:
      flutter: stable
    scripts:
      - name: Create Android project
        script: |
          mkdir -p lib
          cp main.dart lib/main.dart
          flutter create --platforms=android --project-name dressme .
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
